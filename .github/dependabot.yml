version: 2

# Routine updates are grouped into one minor/patch PR per ecosystem; major bumps get their own PRs
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match OPENCV_VERSION in infrastructure/opencv/Dockerfile, so both are upgraded together by hand.
      - dependency-name: opencv-python-headless
    groups:
      python-security:
        applies-to: security-updates
        patterns: ['*']
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /infrastructure/opencv
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
