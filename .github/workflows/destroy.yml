name: Destroy environment
run-name: Destroy ${{ inputs.environment }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy permanently
        type: environment
        required: true
      confirmation:
        description: Type the environment name to confirm deletion of all application data
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate destruction confirmation
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$DEPLOY_ENV" =~ ^[a-z][a-z0-9-]*$ || "$CONFIRMATION" != "$DEPLOY_ENV" ]]; then
            echo "::error::Select a valid environment and type its exact name to confirm destruction."
            exit 1
          fi

  destroy:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'eu-west-2' }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        run: bash infrastructure/validate-deployment-config.sh

      - name: Download OpenCV layer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash infrastructure/download-opencv-layer.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: pnpm nx run-many -t bundle

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure/terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=crossword-solver/$TF_VAR_environment/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate

      - name: Plan destruction
        run: terraform -chdir=infrastructure/terraform plan -destroy -out=destroy.tfplan

      - name: Empty application buckets
        run: bash infrastructure/empty-destroy-buckets.sh

      - name: Apply destruction
        run: terraform -chdir=infrastructure/terraform apply destroy.tfplan

      - name: Report destruction
        run: |
          {
            printf '## Environment destroyed\n\n'
            printf -- '- Environment: %s\n' "$TF_VAR_environment"
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf 'Bootstrap IAM/OIDC resources and the shared state bucket were retained.\n'
          } >> "$GITHUB_STEP_SUMMARY"
