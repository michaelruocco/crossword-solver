name: Destroy environment
run-name: Destroy ${{ inputs.environment }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy permanently
        type: environment
        required: true
      confirmation:
        description: Type the environment name to confirm deletion of all application data
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate destruction confirmation
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$DEPLOY_ENV" =~ ^[a-z][a-z0-9-]*$ || "$CONFIRMATION" != "$DEPLOY_ENV" ]]; then
            echo "::error::Select a valid environment and type its exact name to confirm destruction."
            exit 1
          fi

  destroy:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'eu-west-2' }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Validate AWS configuration
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Configure AWS_ROLE_ARN and TF_STATE_BUCKET as GitHub Actions variables."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download OpenCV layer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(bash infrastructure/layer-release-tag.sh opencv)
          bash infrastructure/wait-for-opencv-release.sh "$tag"
          download_dir="$RUNNER_TEMP/native-layers/opencv"
          gh release download "$tag" --dir "$download_dir" \
            --pattern opencv-layer.zip --pattern SHA256SUMS
          (cd "$download_dir" && sha256sum --check SHA256SUMS)
          mkdir -p infrastructure/opencv/build
          mv "$download_dir/opencv-layer.zip" infrastructure/opencv/build/

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: pnpm nx run-many -t bundle

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure/terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=crossword-solver/$TF_VAR_environment/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate

      - name: Plan destruction
        run: terraform -chdir=infrastructure/terraform plan -destroy -lock-timeout=5m -out=destroy.tfplan

      - name: Empty application buckets in the destroy plan
        run: |
          plan_json="$RUNNER_TEMP/destroy-plan.json"
          terraform -chdir=infrastructure/terraform show -json destroy.tfplan > "$plan_json"
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket_list="$RUNNER_TEMP/destroy-buckets.txt"
          jq -r '.resource_changes[]? | select(.type == "aws_s3_bucket" and (.change.actions | index("delete"))) | .change.before.bucket' \
            "$plan_json" > "$bucket_list"
          while IFS= read -r bucket; do
            case "$bucket" in
              "crossword-solver-$TF_VAR_environment-puzzle-images"|"crossword-solver-$TF_VAR_environment-lambda-layers"|"crossword-solver-$TF_VAR_environment-ui-$account_id") ;;
              *) echo "::error::Refusing to empty unexpected bucket $bucket"; exit 1 ;;
            esac
            if [[ "$bucket" == "$TF_STATE_BUCKET" ]]; then
              echo "::error::Refusing to empty the Terraform state bucket."
              exit 1
            fi
          done < "$bucket_list"
          while IFS= read -r bucket; do
            aws s3 rm "s3://$bucket" --recursive --only-show-errors
            while true; do
              aws s3api list-object-versions --bucket "$bucket" --max-keys 1000 --no-paginate \
                > "$RUNNER_TEMP/bucket-versions.json"
              jq '{Objects: ([.Versions[]?, .DeleteMarkers[]?] | map({Key, VersionId})), Quiet: true}' \
                "$RUNNER_TEMP/bucket-versions.json" > "$RUNNER_TEMP/bucket-deletions.json"
              count=$(jq '.Objects | length' "$RUNNER_TEMP/bucket-deletions.json")
              if [[ "$count" == 0 ]]; then break; fi
              aws s3api delete-objects --bucket "$bucket" \
                --delete "file://$RUNNER_TEMP/bucket-deletions.json" > "$RUNNER_TEMP/bucket-delete-result.json"
              if ! jq -e '(.Errors // []) | length == 0' "$RUNNER_TEMP/bucket-delete-result.json" > /dev/null; then
                echo "::error::S3 could not delete all versions from $bucket."
                exit 1
              fi
            done
          done < "$bucket_list"

      - name: Apply destruction
        run: terraform -chdir=infrastructure/terraform apply -lock-timeout=5m destroy.tfplan

      - name: Report destruction
        run: |
          {
            printf '## Environment destroyed\n\n'
            printf -- '- Environment: %s\n' "$TF_VAR_environment"
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf 'Bootstrap IAM/OIDC resources and the shared state bucket were retained.\n'
          } >> "$GITHUB_STEP_SUMMARY"
