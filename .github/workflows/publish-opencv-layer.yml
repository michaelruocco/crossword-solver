name: Publish OpenCV layer

on:
  push:
    branches: [main]
    paths:
      - infrastructure/opencv/**
      - infrastructure/layer-release-tag.sh
      - .github/workflows/publish-opencv-layer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-opencv-layer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve layer release
        id: layers
        run: |
          tag=$(bash infrastructure/layer-release-tag.sh opencv)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$releases"; then
            echo "Layer release $tag already exists; reusing it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OpenCV layer
        if: steps.layers.outputs.exists == 'false'
        run: |
          docker build --platform linux/amd64 -t crossword-solver-opencv-layer infrastructure/opencv
          ./infrastructure/opencv/build-layer.sh

      - name: Publish layer ZIP
        if: steps.layers.outputs.exists == 'false'
        env:
          LAYER_TAG: ${{ steps.layers.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-layers"
          cp infrastructure/opencv/build/opencv-layer.zip "$RUNNER_TEMP/native-layers/"
          cd "$RUNNER_TEMP/native-layers"
          unzip -t opencv-layer.zip
          sha256sum opencv-layer.zip > SHA256SUMS
          gh release create "$LAYER_TAG" \
            opencv-layer.zip SHA256SUMS \
            --target "$SOURCE_SHA" \
            --title "$LAYER_TAG" \
            --notes "Python 3.14 / linux-amd64 OpenCV Lambda layer built from $SOURCE_SHA. Reused by commits with the same layer build inputs." \
            --latest=false

      - name: Report layer release
        env:
          LAYER_TAG: ${{ steps.layers.outputs.tag }}
        run: |
          printf 'Native layer release: [%s](https://github.com/%s/releases/tag/%s)\n' \
            "$LAYER_TAG" "$GH_REPO" "$LAYER_TAG" >> "$GITHUB_STEP_SUMMARY"
