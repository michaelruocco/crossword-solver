name: Deploy
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment selection
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [[ ! "$DEPLOY_ENV" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Environment names must start with a lowercase letter and contain only lowercase letters, digits, and hyphens."
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'eu-west-2' }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Validate deployment configuration
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Configure AWS_ROLE_ARN and TF_STATE_BUCKET as GitHub Actions variables."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download native layers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for layer in opencv tesseract; do
            tag=$(bash infrastructure/layer-release-tag.sh "$layer")
            echo "Downloading $layer layer from $tag"
            download_dir="$RUNNER_TEMP/native-layers/$layer"
            if ! gh release download "$tag" --dir "$download_dir" \
              --pattern "$layer-layer.zip" --pattern SHA256SUMS; then
              echo "::error::Unable to download $layer layer. Run publish-$layer-layer.yml for this commit and wait for it to succeed before deploying."
              exit 1
            fi
            (cd "$download_dir" && sha256sum --check SHA256SUMS)
            mkdir -p "infrastructure/$layer/build"
            mv "$download_dir/$layer-layer.zip" "infrastructure/$layer/build/"
          done

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen

      - name: Bundle all Lambda packages
        run: pnpm nx run-many -t bundle

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure/terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=crossword-solver/$TF_VAR_environment/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate

      - name: Plan infrastructure
        run: terraform -chdir=infrastructure/terraform plan -lock-timeout=5m -out=tfplan

      - name: Apply infrastructure
        run: terraform -chdir=infrastructure/terraform apply -lock-timeout=5m tfplan

      - name: Deploy UI
        run: pnpm nx run crossword_solver.ui:deploy --skip-nx-cache

      - name: Report deployment
        id: deployment
        env:
          DEPLOY_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          url=$(terraform -chdir=infrastructure/terraform output -raw ui_url)
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          {
            printf '## Deployment\n\n'
            printf -- '- Environment: %s\n' "$TF_VAR_environment"
            printf -- '- Ref: %s\n' "$DEPLOY_REF"
            printf -- '- Commit: %s\n' "$RELEASE_SHA"
            printf -- '- UI: %s\n' "$url"
          } >> "$GITHUB_STEP_SUMMARY"
