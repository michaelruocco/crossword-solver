name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: uv sync --all-packages --frozen

      - if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint typecheck test build bundle

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm nx run-many -t lint typecheck test build bundle

      # Secrets aren't available to fork PRs, and Dependabot PRs only get Dependabot secrets
      - if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
