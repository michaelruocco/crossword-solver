name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: uv sync --all-packages --frozen

      - if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint typecheck test build bundle

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm nx run-many -t lint typecheck test build bundle

      # Secrets aren't available to fork PRs, and Dependabot PRs only get Dependabot secrets
      - if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Package Lambda bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf "$RUNNER_TEMP/lambda-bundles.tar.gz" \
            dist/packages/lambdas/ts-lambdas/bundle \
            dist/packages/lambdas/python-lambdas/puzzle-api/bundle-x86 \
            dist/packages/lambdas/python-lambdas/puzzle-import-worker/bundle-x86

      - name: Upload Lambda bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lambda-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/lambda-bundles.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy-dev:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      lambda-bundles-artifact: lambda-bundles-${{ github.sha }}
