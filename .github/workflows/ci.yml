name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: uv sync --all-packages --frozen

      # Sets NX_BASE/NX_HEAD to the last successful CI run on main (or the PR base)
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx affected -t lint typecheck test build bundle
