packages:
  - packages/*
  - packages/lambdas/*
autoInstallPeers: true
allowBuilds:
  esbuild: true
  nx: true
overrides:
  # nx 23.3.0 pins a vulnerable undici 7.29.0; remove once nx ships a fixed version
  undici: ^7.29.1
  # @nxlv/python 23.2.1 depends on a vulnerable uuid 9; it only uses v4(), which is unchanged in 11
  '@nxlv/python>uuid': ^11.1.1
catalog:
  '@aws-lambda-powertools/tracer': 2.36.0
  '@aws-lambda-powertools/logger': 2.36.0
  '@aws-lambda-powertools/metrics': 2.36.0
  '@aws-lambda-powertools/parameters': 2.36.0
  '@aws-lambda-powertools/parser': 2.36.0
  '@aws-sdk/client-appconfigdata': 3.1146.0
  '@middy/core': 7.9.2
  zod: 4.6.5
  '@types/aws-lambda': 8.10.164
  '@nxlv/python': 23.2.1
