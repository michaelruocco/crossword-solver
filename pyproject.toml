[project]
name = "nx-workspace"
version = "1.0.0"
dependencies = [
  "crossword-solver-adapter-api",
  "crossword-solver-adapter-clue-extractor",
  "crossword-solver-adapter-grid-extractor",
  "crossword-solver-adapter-queue",
  "crossword-solver-adapter-repository",
  "crossword-solver-create-puzzle",
  "crossword-solver-domain-entities",
  "crossword-solver-domain-use-case",
  "crossword-solver-image",
  "crossword-solver-test-utils"
]

[tool.uv.workspace]
members = [
  "packages/lambdas/python-lambdas/adapter/api",
  "packages/lambdas/python-lambdas/adapter/clue_extractor",
  "packages/lambdas/python-lambdas/adapter/grid_extractor",
  "packages/lambdas/python-lambdas/adapter/queue",
  "packages/lambdas/python-lambdas/adapter/repository",
  "packages/lambdas/python-lambdas/create-puzzle",
  "packages/lambdas/python-lambdas/domain/entities",
  "packages/lambdas/python-lambdas/domain/use-case",
  "packages/lambdas/python-lambdas/image",
  "packages/lambdas/python-lambdas/test-utils"
]

[tool.uv.sources.crossword-solver-adapter-api]
workspace = true

[tool.uv.sources.crossword-solver-adapter-clue-extractor]
workspace = true

[tool.uv.sources.crossword-solver-adapter-grid-extractor]
workspace = true

[tool.uv.sources.crossword-solver-adapter-queue]
workspace = true

[tool.uv.sources.crossword-solver-adapter-repository]
workspace = true

[tool.uv.sources.crossword-solver-create-puzzle]
workspace = true

[tool.uv.sources.crossword-solver-domain-entities]
workspace = true

[tool.uv.sources.crossword-solver-domain-use-case]
workspace = true

[tool.uv.sources.crossword-solver-image]
workspace = true

[tool.uv.sources.crossword-solver-test-utils]
workspace = true

[dependency-groups]
dev = [
  "ruff==0.17.0",
  "autopep8>=2.3.1",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "ty==0.0.86",
  "pytest-httpserver>=1.2.0",
]
