[tool.coverage.run]
branch = true
source = [ "crossword_solver_adapter_web" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --import-mode=importlib
 --cov
 --cov-report html:'../../../../../coverage/packages/lambdas/python-lambdas/adapter/web/html'
 --cov-report xml:'../../../../../coverage/packages/lambdas/python-lambdas/adapter/web/coverage.xml'
 --html='../../../../../reports/packages/lambdas/python-lambdas/adapter/web/unittests/html/index.html'
 --junitxml='../../../../../reports/packages/lambdas/python-lambdas/adapter/web/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "crossword_solver_adapter_web" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "crossword-solver-adapter-web"
version = "1.0.0"
description = "Crossword solver web adapter (fetches images over HTTP)."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "crossword-solver-domain-use-case",
]

[tool.uv.sources]
crossword-solver-domain-use-case = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
