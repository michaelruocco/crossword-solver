[tool.coverage.run]
branch = true
source = [ "crossword_solver_adapter_storage" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --import-mode=importlib
 --cov
 --cov-report html:'../../../../../coverage/packages/lambdas/python-lambdas/adapter/storage/html'
 --cov-report xml:'../../../../../coverage/packages/lambdas/python-lambdas/adapter/storage/coverage.xml'
 --html='../../../../../reports/packages/lambdas/python-lambdas/adapter/storage/unittests/html/index.html'
 --junitxml='../../../../../reports/packages/lambdas/python-lambdas/adapter/storage/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "crossword_solver_adapter_storage" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "crossword-solver-adapter-storage"
version = "1.0.0"
description = "Crossword solver image storage adapter (S3)."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "crossword-solver-domain-use-case",
  "crossword-solver-domain-entities",
  "crossword-solver-image",
]

[tool.uv.sources]
crossword-solver-domain-use-case = { workspace = true }
crossword-solver-domain-entities = { workspace = true }
crossword-solver-image = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3>=1.43.115",
    "moto[s3]>=5.2.4",
]
