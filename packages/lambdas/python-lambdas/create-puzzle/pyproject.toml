[tool.coverage.run]
branch = true
source = [ "crossword_solver_create_puzzle" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../../coverage/packages/lambdas/python-lambdas/create-puzzle/html'
 --cov-report xml:'../../../../coverage/packages/lambdas/python-lambdas/create-puzzle/coverage.xml'
 --html='../../../../reports/packages/lambdas/python-lambdas/create-puzzle/unittests/html/index.html'
 --junitxml='../../../../reports/packages/lambdas/python-lambdas/create-puzzle/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "crossword_solver_create_puzzle" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "crossword-solver-create-puzzle"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "aws-lambda-powertools==3.35.0",
  "aws-lambda-powertools[tracer]==3.35.0",
  "aws-lambda-powertools[parser]==3.35.0",
  "aws-lambda-typing==2.20.0"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
