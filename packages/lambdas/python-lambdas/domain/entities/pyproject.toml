[tool.coverage.run]
branch = true
source = [ "crossword_solver_domain_entities" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../../../coverage/packages/lambdas/python-lambdas/domain/entities/html'
 --cov-report xml:'../../../../../coverage/packages/lambdas/python-lambdas/domain/entities/coverage.xml'
 --html='../../../../../reports/packages/lambdas/python-lambdas/domain/entities/unittests/html/index.html'
 --junitxml='../../../../../reports/packages/lambdas/python-lambdas/domain/entities/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "crossword_solver_domain_entities" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "crossword-solver-domain-entities"
version = "1.0.0"
description = "Crossword solver domain entities."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [ ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
