[tool.coverage.run]
branch = true
source = [ "crossword_solver_puzzle_import_worker" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --import-mode=importlib
 --cov
 --cov-report html:'../../../../coverage/packages/lambdas/python-lambdas/puzzle-import-worker/html'
 --cov-report xml:'../../../../coverage/packages/lambdas/python-lambdas/puzzle-import-worker/coverage.xml'
 --html='../../../../reports/packages/lambdas/python-lambdas/puzzle-import-worker/unittests/html/index.html'
 --junitxml='../../../../reports/packages/lambdas/python-lambdas/puzzle-import-worker/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "crossword_solver_puzzle_import_worker" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "crossword-solver-puzzle-import-worker"
version = "1.0.0"
description = "Crossword solver puzzle import worker Lambda."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "aws-lambda-powertools==3.35.0",
  "aws-lambda-powertools[tracer]==3.35.0",
  "aws-lambda-powertools[parser]==3.35.0",
  "aws-lambda-typing==2.20.0",
  "crossword-solver-adapter-api",
  "crossword-solver-adapter-clue-extractor",
  "crossword-solver-adapter-grid-extractor",
  "crossword-solver-adapter-repository",
  "crossword-solver-adapter-storage",
  "crossword-solver-domain-entities",
  "crossword-solver-domain-use-case",
  "crossword-solver-image",
]

[tool.uv.sources]
crossword-solver-adapter-api = { workspace = true }
crossword-solver-adapter-clue-extractor = { workspace = true }
crossword-solver-adapter-grid-extractor = { workspace = true }
crossword-solver-adapter-repository = { workspace = true }
crossword-solver-adapter-storage = { workspace = true }
crossword-solver-domain-entities = { workspace = true }
crossword-solver-domain-use-case = { workspace = true }
crossword-solver-image = { workspace = true }
crossword-solver-test-utils = { workspace = true }

[dependency-groups]
dev = [ "crossword-solver-test-utils" ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"